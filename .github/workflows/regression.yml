name: template-regression
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.14']
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: current
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      GIT_CONFIG_NOSYSTEM: '1'
      GIT_CONFIG_GLOBAL: ${{ runner.temp }}/template-test.gitconfig
      GIT_AUTHOR_NAME: Template CI Test
      GIT_AUTHOR_EMAIL: ci@example.invalid
      GIT_COMMITTER_NAME: Template CI Test
      GIT_COMMITTER_EMAIL: ci@example.invalid
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Check runner Git and installed test dependencies
        run: |
          python --version
          git --version
          node --version
          python -c "import os,pathlib; pathlib.Path(os.environ['GIT_CONFIG_GLOBAL']).write_text('', encoding='utf-8')"
      - name: Run isolated regression
        run: python -B run_tests.py --report-dir ../validation/ci
